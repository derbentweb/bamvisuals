name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pick latest Fabric versions
        run: |
          MC=1.21.11
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "yarn=$YARN loader=$LOADER api=$API"
          if [ -z "$YARN" ] || [ "$YARN" = "null" ] || [ -z "$LOADER" ] || [ -z "$API" ]; then
            echo "Could not find versions"; exit 1
          fi
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          sed -i "s|^fabric_api_version=.*|fabric_api_version=$API|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          cat gradle.properties

      - name: Fix code for 1.21.11 API
        run: |
          cat > /tmp/fix.py <<'PYEOF'
          import pathlib, sys
          C = pathlib.Path("src/client/java/ru/visuals/client")

          def edit(rel, pairs):
              p = C / rel
              s = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in s:
                      print("PATTERN NOT FOUND in", rel, ":", old[:60]); sys.exit(1)
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")

          CAT = "ru.visuals.client.VisualsModClient.CATEGORY"

          # 1. Category type
          edit("VisualsModClient.java", [
              ("    private static KeyBinding openMenuKey;",
               "    public static final KeyBinding.Category CATEGORY =\n"
               "            KeyBinding.Category.create(net.minecraft.util.Identifier.of(\"visualsmod\", \"main\"));\n\n"
               "    private static KeyBinding openMenuKey;"),
              ('"category.visualsmod"\n', "CATEGORY\n"),
          ])
          edit("features/impl/AutoSwapFeature.java", [
              ('"category.visualsmod"', CAT),
              ("        var registryEntry = net.minecraft.registry.Registries.ITEM\n"
               "                .getOrEmpty(net.minecraft.util.Identifier.tryParse(targetId));\n"
               "        if (registryEntry.isEmpty()) return;\n"
               "        Item wanted = registryEntry.get();\n",
               "        net.minecraft.util.Identifier parsedId = net.minecraft.util.Identifier.tryParse(targetId);\n"
               "        if (parsedId == null || !net.minecraft.registry.Registries.ITEM.containsId(parsedId)) return;\n"
               "        Item wanted = net.minecraft.registry.Registries.ITEM.get(parsedId);\n"),
          ])
          edit("features/impl/ElytraHelperFeature.java", [('"category.visualsmod"', CAT)])

          # 2. Dust particle
          edit("features/impl/TrailFeature.java", [
              ("new DustParticleEffect(new Vector3f(r, g, b), 1.0f)",
               "new DustParticleEffect(color & 0xFFFFFF, 1.0f)"),
          ])

          # 3. Screen key input
          edit("gui/VisualsScreen.java", [
              ("    public boolean keyPressed(int keyCode, int scanCode, int modifiers) {\n",
               "    public boolean keyPressed(net.minecraft.client.input.KeyInput input) {\n"
               "        int keyCode = input.key();\n"),
              ("return super.keyPressed(keyCode, scanCode, modifiers);",
               "return super.keyPressed(input);"),
          ])

          # 4. GroundLabel: world render API changed in this Fabric API; feature disabled (stub)
          (C / "features/impl/GroundLabelFeature.java").write_text(
          '''package ru.visuals.client.features.impl;

          import ru.visuals.client.config.FeatureCategory;
          import ru.visuals.client.features.Feature;

          /** Заглушка: world-render API в новом Fabric API изменился, допишем отдельно. */
          public class GroundLabelFeature extends Feature {
              public GroundLabelFeature() {
                  super("ground_label", "Подписи предметов на земле (в разработке)",
                          "Пока не реализовано под 1.21.11.", FeatureCategory.VISUALS);
              }
          }
          ''', encoding="utf-8")
          print("OK all patches applied")
          PYEOF
          python3 /tmp/fix.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: visualsmod-jar
          path: build/libs/*.jar
